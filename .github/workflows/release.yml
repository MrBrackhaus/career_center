name: Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create secrets.dart
        shell: bash
        run: |
          mkdir -p lib/core
          echo "class Secrets {" > lib/core/secrets.dart
          echo "  static const String discordWebhookUrl = '${{ secrets.DISCORD_WEBHOOK }}';" >> lib/core/secrets.dart
          echo "}" >> lib/core/secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows

      - name: Compress Release
        run: |
          Copy-Item -Path browser_extension -Destination build\windows\x64\runner\Release\browser_extension -Recurse
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath CareerCenter-Release-Windows.zip

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          name: "Release ${{ github.ref_name }}"
          body: "Die neueste Version der Bewerbungszentrale. (Änderungen siehe Changelog in der App)"
          artifacts: "CareerCenter-Release-Windows.zip"
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
