name: Windows Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1 | tr -d '\r[:space:]')"
          echo "Tag: $tag / pubspec: $ver"
          if [ -z "$ver" ] || [ "$tag" != "$ver" ]; then
            echo "::error::Tag ($GITHUB_REF_NAME) passt nicht zur pubspec-Version ($ver)."
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create secrets.dart
        shell: bash
        env:
          # Secret nur per Umgebungsvariable, nie direkt im Skripttext
          # (verhindert Shell-/Dart-Injection durch Sonderzeichen).
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          mkdir -p lib/core
          python - <<'PY'
          import json, os
          value = os.environ.get("DISCORD_WEBHOOK", "")
          # JSON-String-Escapes sind gueltige Dart-Escapes; "$" zusaetzlich
          # escapen, damit Dart nicht interpoliert.
          literal = json.dumps(value).replace("$", "\\$")
          with open("lib/core/secrets.dart", "w", encoding="utf-8", newline="\n") as f:
              f.write("class Secrets {\n")
              f.write("  static const String discordWebhookUrl = " + literal + ";\n")
              f.write("}\n")
          print("lib/core/secrets.dart geschrieben (Webhook gesetzt: %s)" % bool(value))
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit & Function Tests
        run: flutter test

      - name: Build Windows App
        run: flutter build windows

      - name: Build Installer
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" windows/installer.iss

      - name: Compress Release
        run: |
          Copy-Item -Path browser_extension -Destination build\windows\x64\runner\Release\browser_extension -Recurse
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath CareerCenter-Release-Windows.zip

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          name: "Release ${{ github.ref_name }}"
          body: "Die neueste Version der Bewerbungszentrale. (Aenderungen siehe Changelog in der App)"
          artifacts: "CareerCenter-Release-Windows.zip,CareerCenter-Setup.exe"
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

