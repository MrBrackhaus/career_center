name: Windows Nightly Build

on:
  push:
    branches:
      - main

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create secrets.dart
        shell: bash
        env:
          # Secret nur per Umgebungsvariable, nie direkt im Skripttext
          # (verhindert Shell-/Dart-Injection durch Sonderzeichen).
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          mkdir -p lib/core
          python - <<'PY'
          import json, os
          value = os.environ.get("DISCORD_WEBHOOK", "")
          # JSON-String-Escapes sind gueltige Dart-Escapes; "$" zusaetzlich
          # escapen, damit Dart nicht interpoliert.
          literal = json.dumps(value).replace("$", "\\$")
          with open("lib/core/secrets.dart", "w", encoding="utf-8", newline="\n") as f:
              f.write("class Secrets {\n")
              f.write("  static const String discordWebhookUrl = " + literal + ";\n")
              f.write("}\n")
          print("lib/core/secrets.dart geschrieben (Webhook gesetzt: %s)" % bool(value))
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit & Function Tests
        run: flutter test

      - name: Build Windows App
        run: flutter build windows

      - name: Compress Release
        run: |
          Copy-Item -Path browser_extension -Destination build\windows\x64\runner\Release\browser_extension -Recurse
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath CareerCenter-Nightly-Windows.zip

      - name: Update Nightly Tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Publish Nightly Release
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: "Nightly Build"
          body: "Automatisierter Entwicklungs-Build (immer auf dem neuesten Stand)."
          artifacts: "CareerCenter-Nightly-Windows.zip"
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
